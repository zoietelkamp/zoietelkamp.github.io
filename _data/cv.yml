      - company: University of Virginia, Department of Astronomy
        position: Graduate Student Researcher
        location: Charlottesville, VA
        start_date: 2021
        summary: "Investigating star formation from low to high masses using observations from ALMA, JWST, Herschel, Spitzer, and SOFIA. Co-developed open-source analysis tools including the sedcreator Python package to enable community science (15+ publications)."

      - company: University of California, Berkeley
        position: Junior Astronomy Specialist
        location: Berkeley, CA
        start_date: 2020
        end_date: 2021
        summary: "Led development of an autoencoder neural network to generate synthetic protoplanetary disk images 1000x faster than traditional radiative transfer calculations, enabling efficient disk modeling. Published first-authored paper in The Astrophysical Journal."

      - company: University of California, Berkeley
        position: Undergraduate Astronomy Researcher
        location: Berkeley, CA
        start_date: 2019
        end_date: 2020
        summary: "Used methods including principal component analysis to investigate relationships between protoplanetary disk physical properties and morphology. Co-authored two publications and participated in observing runs at Keck and Lick observatories."

